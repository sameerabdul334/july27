<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="style.css">
    <title>Semantic+JS</title>
</head>
<body>
    <script src="Script.js"></script>
    <!-- Semantic tags -->

        <h1>Welcome to my page</h1>

    <footer>
